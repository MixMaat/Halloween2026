:root{--bg:#050207;--ink:#f1e6e6;--mute:#b79a9a;--red:#d00000;--org:#ff8a2b;--head:"Creepster","Papyrus","Chalkduster",Georgia,serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 0,#2a0a12,var(--bg) 65%) fixed;color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6;overflow-x:hidden}
h1,h2,.st,.big{font-family:var(--head);font-weight:400;letter-spacing:.05em}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:12px 16px 40px}
#top{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px}
#top button{font:inherit;font-family:system-ui,sans-serif;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid #4a1a24;background:#1a0a10;color:var(--ink);cursor:pointer}
#pg{height:6px;background:#1a0a10;border-radius:4px;overflow:hidden;margin-bottom:14px}#pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--org));transition:width .6s}
h1{font-size:2.6rem;line-height:1.05;margin:.2em 0;color:var(--red);text-shadow:0 0 18px #d0000088;text-align:center;animation:flick 6s infinite}
h2{font-size:1.9rem;margin:.1em 0 .3em;color:var(--org)}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.35}92%{opacity:1}95%{opacity:.5}96%{opacity:1}}
.sc{animation:f .7s both}@keyframes f{from{opacity:0;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ph{border-radius:14px;overflow:hidden;border:1px solid #4a1a24;margin-bottom:12px;box-shadow:0 0 30px #d0000044;position:relative;cursor:zoom-in}
.ph img{display:block;width:100%;height:auto}
.ph.z{overflow:auto;cursor:zoom-out;max-height:70vh}.ph.z img{width:230%;max-width:none}
.ph .tip{position:absolute;right:8px;bottom:8px;background:#000a;padding:2px 8px;border-radius:8px;font:.75rem system-ui}.ph.z .tip{display:none}
.b{display:block;width:100%;margin-top:10px;padding:14px 16px;font:inherit;font-family:system-ui,sans-serif;font-size:1.05rem;font-weight:600;color:var(--ink);background:#2a0d16;border:1px solid var(--red);border-radius:12px;cursor:pointer;text-align:left}
.b:active{background:var(--red)}.b.go{background:var(--red);text-align:center;font-size:1.15rem}
.b.bad{background:#400;opacity:.6}.b.ok{background:#0a4a1a;border-color:#2c2}
.fb{min-height:1.6em;color:var(--org);font-style:italic}
.big{display:block;text-align:center;font-size:clamp(1.6rem,7.5vw,2.3rem);line-height:1.2;color:var(--ink);margin:.7em 0}
.mut{color:var(--mute);font-size:.88rem;font-family:system-ui,sans-serif;text-align:center}
svg.room{width:100%;height:auto;display:block;border-radius:14px;border:1px solid #4a1a24;margin-bottom:12px;background:#000}
.pt .eye{display:none}.pt.open .eye{display:inline}.pt{cursor:pointer}
.dark{animation:fl3 1.6s steps(1) both}@keyframes fl3{0%{filter:brightness(.15)}20%{filter:brightness(1)}30%{filter:brightness(.1)}50%{filter:brightness(1)}60%{filter:brightness(.1)}100%{filter:brightness(1)}}
#scare{position:fixed;inset:0;z-index:50;display:none;background:#000;align-items:center;justify-content:center;overflow:hidden}
#scare.on{display:flex;animation:shk .12s linear 8}
#scare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.3) saturate(1.25);animation:zin .35s cubic-bezier(.1,.9,.2,1) both}
#scare.inv img{filter:invert(1) contrast(1.4)}
#scare.gl{background:repeating-linear-gradient(0deg,#300 0 4px,#d00 4px 8px)}
#scare.gl .st{animation:gl .18s steps(2) infinite}
#scare .big2{position:absolute;font-size:70vmin;line-height:1;animation:zin .3s both}
.st{position:relative;font-size:clamp(3rem,17vw,7rem);color:var(--red);text-shadow:0 0 20px #000,0 0 40px #f00;text-align:center;line-height:1}
@keyframes zin{from{transform:scale(.5);opacity:0}to{transform:scale(1.12);opacity:1}}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-14px,8px)}50%{transform:translate(12px,-10px)}75%{transform:translate(-8px,-6px)}100%{transform:translate(0,0)}}
@keyframes gl{0%{text-shadow:6px 0 #0ff,-6px 0 #f0f;transform:translateX(-4px)}100%{text-shadow:-6px 0 #0ff,6px 0 #f0f;transform:translateX(5px)}}
#fxflash{position:fixed;inset:0;z-index:60;pointer-events:none;background:#e8f0ff;opacity:0}#fxflash.go{animation:fl2 1.1s}
@keyframes fl2{0%{opacity:0}6%{opacity:.85}16%{opacity:0}50%{opacity:0}56%{opacity:.7}70%{opacity:0}100%{opacity:0}}
#fxshake.sh{animation:shk .12s linear 5}
.fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.fog{position:absolute;left:-40%;width:180%;bottom:-12%;height:55%;background:radial-gradient(ellipse 14% 38% at 15% 60%,rgba(200,170,180,.12),transparent),radial-gradient(ellipse 16% 45% at 48% 50%,rgba(200,170,180,.10),transparent),radial-gradient(ellipse 13% 40% at 78% 62%,rgba(200,170,180,.12),transparent);animation:drift 160s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
.ember{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--org);box-shadow:0 0 8px 2px #ff8a2b99;opacity:0;animation:rise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--x),-105vh);opacity:0}}
.rain{position:fixed;top:-40px;z-index:40;font-size:1.8rem;pointer-events:none;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#calm{position:fixed;inset:0;z-index:70;background:#000d;display:none;align-items:center;justify-content:center;padding:20px}#calm.on{display:flex}
#calm div{background:#1a0a10;border:1px solid var(--red);border-radius:16px;padding:20px;max-width:420px;text-align:center}
.note{border:1px dashed var(--org);border-radius:12px;padding:10px 12px;margin:14px 0;font-family:system-ui,sans-serif;font-size:.95rem;background:#1f0d0a}
input.nm{width:100%;margin-top:10px;padding:13px 14px;font:inherit;font-family:system-ui,sans-serif;font-size:1.05rem;color:var(--ink);background:#1a0a10;border:1px solid #4a1a24;border-radius:12px}
.lamp{position:relative;height:min(60vh,420px);border-radius:14px;overflow:hidden;border:1px solid #4a1a24;background:linear-gradient(#1b1020,#0a060d);touch-action:none;user-select:none;-webkit-user-select:none;margin-bottom:10px}
.lamp svg,.lamp canvas{position:absolute;inset:0;width:100%;height:100%}.lamp canvas{touch-action:none}
.lamp .it{position:absolute;font-size:2.6rem;transform:translate(-50%,-50%);transition:transform .3s,filter .3s}.lamp .it.f{filter:drop-shadow(0 0 12px #ff8a2b);transform:translate(-50%,-50%) scale(1.5)}
.dip{background:linear-gradient(#2a1a0a,#140a05);border:4px double #d4a43a;border-radius:14px;padding:18px;text-align:center;color:#f4e3b0}
.dip h1{font-size:2.2rem;margin:.1em 0}.dn{font-family:var(--head);font-size:2.4rem;color:#ffd76a;margin:.2em 0;word-break:break-word;line-height:1.1}
.sign{font-family:var(--head);font-size:1.7rem;color:#ffd76a;margin:.3em 0 0}.dh{font-size:3.2rem}.stars{font-size:1.7rem;margin:.3em 0}
#gh{text-align:center;font-size:7rem;line-height:1.2;cursor:pointer;user-select:none;transition:font-size .2s,opacity .2s}
.cam{position:relative;border-radius:14px;overflow:hidden;border:1px solid #4a1a24;background:#000;margin-bottom:10px}.cam video{display:block;width:100%;transform:scaleX(-1)}
.gh2{position:absolute;font-size:5rem;transform:translate(-50%,-50%);opacity:.85;filter:drop-shadow(0 0 10px #fff);animation:bob2 3s ease-in-out infinite alternate}@keyframes bob2{from{margin-top:0}to{margin-top:-10px}}
.shot{width:100%;border-radius:14px;border:2px solid var(--red);display:block;margin-bottom:8px}
@media (prefers-reduced-motion:reduce){#scare.on,#fxshake.sh,h1{animation:none}.fx{display:none}}
</style>

const VOL=1.6;
const reduced=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
/* ---------- Geluid ---------- */
let ctx,master,mus,delay,nb,musOn=false,muted=false,amb=[],tm;
function au(){
  if(ctx){if(ctx.state==="suspended")ctx.resume();return}
  ctx=new(window.AudioContext||window.webkitAudioContext)();
  master=ctx.createGain();master.gain.value=muted?0:VOL;
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=0;comp.ratio.value=14;comp.attack.value=.002;comp.release.value=.2;
  master.connect(comp);comp.connect(ctx.destination);
  mus=ctx.createGain();mus.gain.value=0;mus.connect(master);
  delay=ctx.createDelay(1);delay.delayTime.value=.45;
  const fb=ctx.createGain();fb.gain.value=.4;delay.connect(fb);fb.connect(delay);
  const wet=ctx.createGain();wet.gain.value=.5;delay.connect(wet);wet.connect(master);
  nb=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
const ns=()=>{const s=ctx.createBufferSource();s.buffer=nb;s.loop=true;return s};
const env=(g,t,a,p,d)=>{g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+d)};
function osc(type,f1,f2,t,dur,peak,att,echo,dest){
  const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur*.8);
  env(g,t,att,peak,dur);o.connect(g);g.connect(dest||master);if(echo)g.connect(delay);o.start(t);o.stop(t+dur+.1);return o}
function nz(t,type,freq,q,att,peak,dur){const n=ns(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type=type;f.frequency.value=freq;f.Q.value=q;
  env(g,t,att,peak,dur);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+dur+.1)}
const SFX={
  bell(){const t=ctx.currentTime;[[659,0],[523,.55]].forEach(([f,d])=>{osc("sine",f,0,t+d,1.4,.7,.01,true);osc("sine",f*2,0,t+d,.9,.25,.01)})},
  knock(n){const t0=ctx.currentTime;for(let i=0;i<(n||4);i++){const t=t0+i*.32;osc("triangle",230,70,t,.2,1,.004);nz(t,"bandpass",1400,1,.003,.9,.07)}},
  creak(){const t=ctx.currentTime,o=ctx.createOscillator(),v=ctx.createOscillator(),vg=ctx.createGain(),f=ctx.createBiquadFilter(),g=ctx.createGain();
    o.type="sawtooth";o.frequency.setValueAtTime(170,t);o.frequency.exponentialRampToValueAtTime(65,t+1.8);v.frequency.value=16;vg.gain.value=30;v.connect(vg);vg.connect(o.frequency);
    f.type="bandpass";f.frequency.value=900;f.Q.value=5;env(g,t,.2,.6,2);o.connect(f);f.connect(g);g.connect(master);o.start(t);v.start(t);o.stop(t+2.1);v.stop(t+2.1)},
  thunder(){const t=ctx.currentTime,n=ns(),f=ctx.createBiquadFilter(),g=ctx.createGain();f.type="lowpass";f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(90,t+4);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(1,t+.04);g.gain.exponentialRampToValueAtTime(.0001,t+4.5);n.connect(f);f.connect(g);g.connect(master);n.start(t);n.stop(t+4.6)},
  stab(){const t=ctx.currentTime;[466,880,932,1245,1760].forEach(f=>osc("sawtooth",f,f*.97,t,1.3,.22,.004));nz(t,"highpass",2500,.7,.003,.8,.45)},
  scream(){const t=ctx.currentTime,o=ctx.createOscillator(),v=ctx.createOscillator(),vg=ctx.createGain(),g=ctx.createGain(),f1=ctx.createBiquadFilter(),f2=ctx.createBiquadFilter();
    o.type="sawtooth";o.frequency.setValueAtTime(520,t);o.frequency.exponentialRampToValueAtTime(1350,t+.9);o.frequency.exponentialRampToValueAtTime(900,t+1.7);
    v.frequency.value=9;vg.gain.value=45;v.connect(vg);vg.connect(o.frequency);
    f1.type="bandpass";f1.frequency.value=900;f1.Q.value=3;f2.type="bandpass";f2.frequency.value=2200;f2.Q.value=2;
    env(g,t,.05,1,1.8);o.connect(f1);o.connect(f2);f1.connect(g);f2.connect(g);g.connect(master);o.start(t);v.start(t);o.stop(t+1.9);v.stop(t+1.9);nz(t,"highpass",3000,.5,.05,.5,1.5)},
  growl(){const t=ctx.currentTime,o=ctx.createOscillator(),l=ctx.createOscillator(),lg=ctx.createGain(),f=ctx.createBiquadFilter(),g=ctx.createGain(),am=ctx.createGain();
    o.type="sawtooth";o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(45,t+1.2);l.frequency.value=28;lg.gain.value=.5;am.gain.value=.5;
    l.connect(lg);lg.connect(am.gain);f.type="lowpass";f.frequency.value=420;env(g,t,.05,1,1.4);o.connect(am);am.connect(f);f.connect(g);g.connect(master);o.start(t);l.start(t);o.stop(t+1.5);l.stop(t+1.5);nz(t,"lowpass",300,.7,.05,.5,1.2)},
  boom(){const t=ctx.currentTime;osc("sine",95,28,t,1.6,1,.004);nz(t,"lowpass",250,.7,.004,.9,1.2)},
  buzz(){const t=ctx.currentTime;[0,.18,.3,.55,.7].forEach(d=>osc("square",110,0,t+d,.1,.35,.005))},
  whisper(){const t=ctx.currentTime;nz(t,"bandpass",3200,3,.6,.5,2.2)},
  heart(){for(let i=0;i<5;i++)[0,.22].forEach(d=>osc("sine",75,40,ctx.currentTime+i*.8+d,.2,d?.7:1,.01))},
  win(){[523,659,784,1047,1319].forEach((f,i)=>osc("triangle",f,0,ctx.currentTime+i*.13,.9,.3,.02,true))}
};
function sfx(k,a){if(!ctx||muted)return;try{SFX[k](a)}catch(e){}}
const sc=[220,246.94,261.63,329.63,349.23,415.3,440,523.25,659.25,880];
function note(){if(!musOn)return;osc("triangle",sc[Math.floor(Math.random()*sc.length)],0,ctx.currentTime,3.2,.22,.08,true,mus);tm=setTimeout(note,1700+Math.random()*3500)}
function startAmb(){const t=ctx.currentTime;
  [110,116.5,164.8].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();
    o.type=i===2?"triangle":"sine";o.frequency.value=f;g.gain.value=i===2?.05:.11;l.frequency.value=.07+i*.05;lg.gain.value=g.gain.value*.6;
    l.connect(lg);lg.connect(g.gain);o.connect(g);g.connect(mus);o.start(t);l.start(t);amb.push(o,l)});
  const n=ns(),bp=ctx.createBiquadFilter(),g=ctx.createGain(),l=ctx.createOscillator(),lg=ctx.createGain();
  bp.type="bandpass";bp.frequency.value=500;bp.Q.value=1.2;g.gain.value=.45;l.frequency.value=.11;lg.gain.value=300;
  l.connect(lg);lg.connect(bp.frequency);n.connect(bp);bp.connect(g);g.connect(mus);n.start(t);l.start(t);amb.push(n,l)}
function setMusic(on){au();musOn=on;clearTimeout(tm);if(on){if(!amb.length)startAmb();note();mus.gain.setTargetAtTime(.22,ctx.currentTime,1.2)}else mus.gain.setTargetAtTime(0,ctx.currentTime,.6)}
function keepAlive(){if(ctx&&musOn&&ctx.state!=="running")ctx.resume().catch(()=>{})}
document.addEventListener("pointerdown",keepAlive,{capture:true});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){keepAlive();if(musOn){clearTimeout(tm);note()}}});
setInterval(keepAlive,4000);
function setMute(m){muted=m;if(master)master.gain.value=m?0:VOL;$("mu").textContent=m?"🔇 Geluid uit":"🔊 Geluid aan"}

/* ---------- Schrikeffecten ---------- */
const restart=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
function flash(){restart($("fxflash"),"go")}
function shake(){if(!reduced)restart($("fxshake"),"sh")}
let sTm;
function hide(){$("scare").className="";$("scare").innerHTML="";clearTimeout(sTm)}
function scare(o){
  const s=$("scare");s.innerHTML=(o.img?'<img alt="" src="'+o.img+'">':"")+(o.big?'<div class="big2">'+o.big+'</div>':"")+(o.text?'<div class="st">'+o.text+'</div>':"");
  s.className="on"+(o.inv?" inv":"")+(o.gl?" gl":"");void s.offsetWidth;
  (o.snd||[]).forEach(([k,a,d])=>setTimeout(()=>sfx(k,a),d||0));
  if(navigator.vibrate)try{navigator.vibrate([200,80,200])}catch(e){}
