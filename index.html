:root{--bg:#050207;--ink:#f1e6e6;--mute:#b79a9a;--red:#d00000;--org:#ff8a2b;--head:"Creepster","Papyrus","Chalkduster",Georgia,serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(circle at 50% 0,#2a0a12,var(--bg) 65%) fixed;color:var(--ink);font-family:Georgia,"Times New Roman",serif;line-height:1.6;overflow-x:hidden}
h1,h2,.st,.big{font-family:var(--head);font-weight:400;letter-spacing:.05em}
main{position:relative;z-index:2;max-width:560px;margin:0 auto;padding:12px 16px 40px}
#pg{height:6px;background:#1a0a10;border-radius:4px;overflow:hidden;margin-bottom:14px}#pg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--org));transition:width .6s}
h1{font-size:2.6rem;line-height:1.05;margin:.2em 0;color:var(--red);text-shadow:0 0 18px #d0000088;text-align:center;animation:flick 6s infinite}
h2{font-size:1.9rem;margin:.1em 0 .3em;color:var(--org)}
@keyframes flick{0%,90%,100%{opacity:1}91%{opacity:.35}92%{opacity:1}95%{opacity:.5}96%{opacity:1}}
.sc{animation:f .7s both}@keyframes f{from{opacity:0;transform:translateY(8px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ph{border-radius:14px;overflow:hidden;border:1px solid #4a1a24;margin-bottom:12px;box-shadow:0 0 30px #d0000044;position:relative;cursor:zoom-in}
.ph img{display:block;width:100%;height:auto}
.ph.z{overflow:auto;cursor:zoom-out;max-height:70vh}.ph.z img{width:230%;max-width:none}
.ph .tip{position:absolute;right:8px;bottom:8px;background:#000a;padding:2px 8px;border-radius:8px;font:.75rem system-ui}.ph.z .tip{display:none}
.b{display:block;width:100%;margin-top:10px;padding:14px 16px;font:inherit;font-family:system-ui,sans-serif;font-size:1.05rem;font-weight:600;color:var(--ink);background:#2a0d16;border:1px solid var(--red);border-radius:12px;cursor:pointer;text-align:left}
.b:active{background:var(--red)}.b.go{background:var(--red);text-align:center;font-size:1.15rem}
.b.bad{background:#400;opacity:.6}.b.ok{background:#0a4a1a;border-color:#2c2}
.fb{min-height:1.6em;color:var(--org);font-style:italic}
.big{display:block;text-align:center;font-size:clamp(1.6rem,7.5vw,2.3rem);line-height:1.2;color:var(--ink);margin:.7em 0}
.mut{color:var(--mute);font-size:.88rem;font-family:system-ui,sans-serif;text-align:center}
svg.room{width:100%;height:auto;display:block;border-radius:14px;border:1px solid #4a1a24;margin-bottom:12px;background:#000}
.pt .eye{display:none}.pt.open .eye{display:inline}.pt{cursor:pointer}
.dark{animation:fl3 1.6s steps(1) both}@keyframes fl3{0%{filter:brightness(.15)}20%{filter:brightness(1)}30%{filter:brightness(.1)}50%{filter:brightness(1)}60%{filter:brightness(.1)}100%{filter:brightness(1)}}
#scare{position:fixed;inset:0;z-index:50;display:none;background:#000;align-items:center;justify-content:center;overflow:hidden}
#scare.on{display:flex;animation:shk .12s linear 8}
#scare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:contrast(1.3) saturate(1.25);animation:zin .35s cubic-bezier(.1,.9,.2,1) both}
#scare.inv img{filter:invert(1) contrast(1.4)}
#scare.gl{background:repeating-linear-gradient(0deg,#300 0 4px,#d00 4px 8px)}
#scare.gl .st{animation:gl .18s steps(2) infinite}
#scare .big2{position:absolute;font-size:70vmin;line-height:1;animation:zin .3s both}
.st{position:relative;font-size:clamp(3rem,17vw,7rem);color:var(--red);text-shadow:0 0 20px #000,0 0 40px #f00;text-align:center;line-height:1}
@keyframes zin{from{transform:scale(.5);opacity:0}to{transform:scale(1.12);opacity:1}}
@keyframes shk{0%{transform:translate(0,0)}25%{transform:translate(-14px,8px)}50%{transform:translate(12px,-10px)}75%{transform:translate(-8px,-6px)}100%{transform:translate(0,0)}}
@keyframes gl{0%{text-shadow:6px 0 #0ff,-6px 0 #f0f;transform:translateX(-4px)}100%{text-shadow:-6px 0 #0ff,6px 0 #f0f;transform:translateX(5px)}}
#fxflash{position:fixed;inset:0;z-index:60;pointer-events:none;background:#e8f0ff;opacity:0}#fxflash.go{animation:fl2 1.1s}
@keyframes fl2{0%{opacity:0}6%{opacity:.85}16%{opacity:0}50%{opacity:0}56%{opacity:.7}70%{opacity:0}100%{opacity:0}}
#fxshake.sh{animation:shk .12s linear 5}
.fx{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.fog{position:absolute;left:-40%;width:180%;bottom:-12%;height:55%;background:radial-gradient(ellipse 14% 38% at 15% 60%,rgba(200,170,180,.12),transparent),radial-gradient(ellipse 16% 45% at 48% 50%,rgba(200,170,180,.10),transparent),radial-gradient(ellipse 13% 40% at 78% 62%,rgba(200,170,180,.12),transparent);animation:drift 160s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-5%)}to{transform:translateX(5%)}}
.ember{position:absolute;bottom:-10px;width:4px;height:4px;border-radius:50%;background:var(--org);box-shadow:0 0 8px 2px #ff8a2b99;opacity:0;animation:rise var(--t) linear infinite;animation-delay:var(--dl)}
@keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}100%{transform:translate(var(--x),-105vh);opacity:0}}
.rain{position:fixed;top:-40px;z-index:40;font-size:1.8rem;pointer-events:none;animation:fall var(--t) linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.note{border:1px dashed var(--org);border-radius:12px;padding:10px 12px;margin:14px 0;font-family:system-ui,sans-serif;font-size:.95rem;background:#1f0d0a}
input.nm{width:100%;margin-top:10px;padding:13px 14px;font:inherit;font-family:system-ui,sans-serif;font-size:1.05rem;color:var(--ink);background:#1a0a10;border:1px solid #4a1a24;border-radius:12px}
.lamp{position:relative;height:min(60vh,420px);border-radius:14px;overflow:hidden;border:1px solid #4a1a24;background:linear-gradient(#1b1020,#0a060d);touch-action:none;user-select:none;-webkit-user-select:none;margin-bottom:10px}
.lamp svg,.lamp canvas{position:absolute;inset:0;width:100%;height:100%}.lamp canvas{touch-action:none}
.lamp .it{position:absolute;font-size:2.6rem;transform:translate(-50%,-50%);transition:transform .3s,filter .3s}.lamp .it.f{filter:drop-shadow(0 0 12px #ff8a2b);transform:translate(-50%,-50%) scale(1.5)}
.dip{background:linear-gradient(#2a1a0a,#140a05);border:4px double #d4a43a;border-radius:14px;padding:18px;text-align:center;color:#f4e3b0}
.dip h1{font-size:2.2rem;margin:.1em 0}.dn{font-family:var(--head);font-size:2.4rem;color:#ffd76a;margin:.2em 0;word-break:break-word;line-height:1.1}
.sign{font-family:var(--head);font-size:1.7rem;color:#ffd76a;margin:.3em 0 0}.dh{font-size:3.2rem}.stars{font-size:1.7rem;margin:.3em 0}
.cam{position:relative;border-radius:14px;overflow:hidden;border:1px solid #4a1a24;background:#000;margin-bottom:10px}.cam video{display:block;width:100%;transform:scaleX(-1)}
.gh2{position:absolute;font-size:5rem;transform:translate(-50%,-50%);opacity:.85;filter:drop-shadow(0 0 10px #fff);animation:bob2 3s ease-in-out infinite alternate}@keyframes bob2{from{margin-top:0}to{margin-top:-10px}}
.shot{width:100%;border-radius:14px;border:2px solid var(--red);display:block;margin-bottom:8px}
.arena{position:relative;height:min(52vh,380px);border-radius:14px;border:1px solid #4a1a24;background:radial-gradient(circle at 50% 50%,#1d0d14,#07030a);overflow:hidden;touch-action:manipulation;margin-bottom:8px}
#gh{position:absolute;transform:translate(-50%,-50%);cursor:pointer;user-select:none;-webkit-user-select:none;padding:12px;line-height:1;transition:font-size .15s}
#gh.pop{animation:pop .25s both}@keyframes pop{from{transform:translate(-50%,-50%) scale(.5)}to{transform:translate(-50%,-50%) scale(1)}}
.tbar{height:8px;background:#1a0a10;border-radius:4px;overflow:hidden;margin-bottom:6px}.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--org))}
.spd{position:fixed;left:0;top:0;z-index:40;pointer-events:none;font-size:2.4rem;line-height:1;animation:crawl var(--dur) linear forwards;filter:drop-shadow(0 0 4px #000)}
.spd span{display:block;animation:wig .3s ease-in-out infinite alternate}
@keyframes wig{from{transform:translateX(-4px) rotate(-6deg)}to{transform:translateX(4px) rotate(6deg)}}
@keyframes crawl{0%{transform:translate(var(--sx),var(--sy)) rotate(var(--rot))}
 25%,35%{transform:translate(calc(var(--sx) + (var(--ex) - var(--sx)) * .3),calc(var(--sy) + (var(--ey) - var(--sy)) * .3)) rotate(var(--rot))}
 60%,70%{transform:translate(calc(var(--sx) + (var(--ex) - var(--sx)) * .65),calc(var(--sy) + (var(--ey) - var(--sy)) * .65)) rotate(var(--rot))}
 100%{transform:translate(var(--ex),var(--ey)) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){.spd{display:none}}
#watch{position:fixed;inset:0;z-index:55;display:none;background:#0a0204;align-items:center;justify-content:center;overflow:hidden}
#watch.on{display:flex;animation:shk .12s linear 6}
#watch video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:contrast(1.25) saturate(.5) brightness(.8);display:none}
#watch.cam video{display:block}
#watch .wr{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(120,0,10,.15),rgba(60,0,10,.75))}
#watch .wt{position:relative;font-family:var(--head);font-size:clamp(2.6rem,13vw,5.5rem);line-height:1.05;text-align:center;color:#e00000;text-shadow:0 0 18px #000,0 0 36px #f00;padding:0 16px;animation:wflick 1.2s steps(1) infinite}
#watch:not(.cam) .wt::before{content:"👀";display:block;font-size:.8em;margin-bottom:.1em}
@keyframes wflick{0%,100%{opacity:1}30%{opacity:.55}34%{opacity:1}70%{opacity:.7}73%{opacity:1}}
@media (prefers-reduced-motion:reduce){#watch.on,#watch .wt{animation:none}}
.tile{display:flex;align-items:center;gap:16px;text-align:left;width:100%;padding:16px;margin-top:12px;border-radius:18px;background:#2a0d16;border:2px solid var(--red);color:var(--ink);cursor:pointer}
.tile .ic{font-size:3.6rem;line-height:1;flex:0 0 auto}
.tile .tt{display:block;font-family:var(--head);font-size:1.7rem;letter-spacing:.05em;line-height:1.1;color:var(--ink)}
.tile .ts{display:block;font-size:.92rem;color:var(--mute);margin-top:3px}
.tile.t-foto{border-color:#8a5cf6;background:#1d1236}.tile.t-dip{border-color:#d4a43a;background:#2a1d08}
.tile.t-snoep{border-color:var(--org);background:#3a1a06;animation:tpulse 2.2s ease-in-out infinite}
@keyframes tpulse{0%,100%{box-shadow:0 0 0 0 #ff8a2b55}50%{box-shadow:0 0 18px 4px #ff8a2b88}}
.priv{margin-top:28px;padding-top:12px;border-top:1px solid #2a1018;font-family:system-ui,sans-serif;font-size:.72rem;line-height:1.45;color:#8a7478;text-align:left}
.priv h3{margin:0 0 4px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em}.priv p{margin:0 0 6px}.priv a{color:#b79a9a}
@media (prefers-reduced-motion:reduce){.tile.t-snoep{animation:none}}
@media (prefers-reduced-motion:reduce){#scare.on,#fxshake.sh,h1{animation:none}.fx{display:none}}
#top{display:flex;justify-content:flex-end;margin-bottom:8px}
#top button{font:inherit;font-family:system-ui,sans-serif;font-size:.85rem;padding:6px 12px;border-radius:999px;border:1px solid #4a1a24;background:#1a0a10;color:var(--ink);cursor:pointer}
.tile.xl{padding:22px 18px;margin-top:16px}.tile.xl .ic{font-size:4.6rem}.tile.xl .tt{font-size:2.1rem}
.tile.t-foto{animation:tpulse2 2.2s ease-in-out infinite}
@keyframes tpulse2{0%,100%{box-shadow:0 0 0 0 #8a5cf655}50%{box-shadow:0 0 20px 5px #8a5cf699}}
.more{margin:30px 0 0;text-align:center;font-family:system-ui,sans-serif;font-size:.95rem;color:var(--mute)}.more a{color:var(--org)}
.sub2{margin:22px 0 0;text-align:center;font-family:system-ui,sans-serif;font-size:.74rem;line-height:1.5;color:#7d6a6e}.sub2 a{color:#9d8a8e}
.logo{display:block;width:44px;margin:20px auto 6px;opacity:.7}.logo:hover,.logo:focus{opacity:1}.logo img{display:block;width:44px;height:44px;border-radius:50%}
@media (prefers-reduced-motion:reduce){.tile.t-foto{animation:none}}
</style>
